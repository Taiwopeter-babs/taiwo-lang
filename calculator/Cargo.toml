[package]
name = "calculator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
pest = "2.8.6"
pest_derive = "2.8.6"
inkwell = {version = "0.9.0", features = ["llvm14-0"], optional = true}
rustyline = "18.0.1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "main"
path = "src/main.rs"
test = false

[[bin]]
name = "repl"
test = false

[features]
default = ["interpreter"]
jit = ["inkwell"]
interpreter = []
vm = []

